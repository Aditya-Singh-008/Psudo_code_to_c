<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo_code_to_C</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="image.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close" />
</head>

<body>
    <div id="top-label">
        <div id="head">Pseudo Code To C
        </div>
    </div>
    <div id="alert_outer">
        <div id="alert">
            Invalid Input
            <span class="material-symbols-outlined" onclick="closealert()">X
            </span>
        </div>
    </div>
    <div class="main-wrapper">
        <div id="left-element">
            <h3>Instructions</h3>
            <p>1. START / STOP --> main() { ... }</p>
            <p>2. VAR x AS INT --> int x;</p>
            <p>3. SET x TO 5 --> x = 5;</p>
            <p>4. SHOW "Hi" --> printf("Hi");</p>
            <p>5. GET x --> scanf("%d",&x);</p>
            <p>6. IF ELSE / ENDIF --> if / else </p>
        </div>

        <div id="center">
            <div id="print">
                <textarea id="container" placeholder="Enter pseudocode here..."></textarea>
                <div id="option">
                    <label>Select Language</label>
                    <select name="option" id="value">
                        <option value="C">C</option>
                        <option value="Python">Python</option>
                        <option value="Java">Java</option>
                    </select>
                    <div class="arrow-container">
                        <div class="arrow"></div>
                    </div>
                </div>
                <textarea name="" id="output" placeholder="Output here"></textarea>
            </div>
            <div id="warnings-panel">
                <div id="warnings-header">
                    <span id="warnings-icon">⚠</span>
                    <span>Compiler Diagnostics</span>
                    <span id="warnings-close" onclick="closeWarnings()">✕</span>
                </div>
                <pre id="warnings-body"></pre>
            </div>
            <div id="select">
                <button class="button" onclick="prt(event)" type="button" id="load">RUN</button>
                <button class="button" onclick="reset()" type="reset">RESET</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>

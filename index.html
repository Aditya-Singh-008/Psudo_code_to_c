<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusdo_code_to_C</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="image.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double+Ink:wght@100..900&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>
    <div id="top-label">
        <div id="head">Pusdo Code To C</div>
    </div>
    
    <div class="main-wrapper"> <!-- Add this wrapper -->
        <div id="left-element">
            <h3>Instructions</h3>
            <p>1. START / STOP -->	main() { ... }</p>
            <p>2. VAR x AS INT -->  int x;</p>
            <p>3. SET x TO 5 --> x = 5;</p>
            <p>4. SHOW "Hi" --> printf("Hi");</p>
            <p>5. GET x --> scanf("%d",&x);</p>
            <p>6. IF  ELSE / ENDIF -->  if / else </p>
            <p>7. WHILE / DONE --> while(cond){...}</p>
        </div>
        
        <div id="center">
            <div id="print">
                <textarea id="container" placeholder="Enter pseudocode here..."></textarea>
                <div class="arrow-container">
        <div class="arrow"></div>
    </div>
                <textarea name="" id="output" placeholder="Output here"></textarea>
            </div>
            <div id="select">
                <button class="button" onclick="prt(event)" type="button" id="load">RUN</button>
                <button class="button" onclick="reset()" type="reset">RESET</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
